<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOMK.RAR | Música</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RSNX4K68M5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-RSNX4K68M5');
</script>
</head>
<body>
  <header class="navbar">
    <div class="logo">tomk<span>.rar</span></div>
    <nav aria-label="Navegación principal">
      <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Inicio</a>
      <a href="musica.html" class="nav-link active"><i class="fa-solid fa-compact-disc"></i> Música</a>
      <a href="social.html" class="nav-link"><i class="fa-solid fa-share-nodes"></i> Social</a>
    </nav>
  </header>

  <main class="section page-main">
    <section class="music-section">
      <div class="section-header">
        <h1>Colección Musical</h1>
        <p>Dos selecciones independientes: explorá artistas, álbumes y canciones de cada playlist.</p>
      </div>

      <div class="playlist-tabs" role="tablist" aria-label="Playlists">
        <button class="playlist-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="lnrt-panel" data-playlist="LNRT">LNRT</button>
        <button class="playlist-tab" type="button" role="tab" aria-selected="false" aria-controls="mexclaz-panel" data-playlist="MEXCLAZ">MEXCLAZ</button>
      </div>

      <div class="search-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="Buscar artista, álbum o canción...">
        <button id="clearSearch" class="clear-btn" type="button" aria-label="Limpiar búsqueda">&times;</button>
      </div>
      <div id="resultsCount" class="results-count">Cargando álbumes...</div>
      <div id="lnrt-panel" class="playlist-panel is-active" role="tabpanel">
        <div id="albumsGrid" class="albums-grid"></div>
      </div>
      <div id="mexclaz-panel" class="playlist-panel" role="tabpanel" hidden>
        <div id="mexclazGrid" class="albums-grid"></div>
      </div>
      <section class="music-recommendations" aria-labelledby="recommendations-title">
        <h2 id="recommendations-title">Recomendaciones</h2>
        <div id="musicRecommendations" class="public-feed" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-label="Portada del álbum">
    <button class="close-modal" id="closeModal" type="button" aria-label="Cerrar">&times;</button>
    <div class="modal-content">
      <img id="modalImg" src="" alt="Portada en grande">
      <div class="modal-info">
        <h2 id="modalTitle">Título del Álbum</h2>
        <p id="modalArtist">Artista</p>
        <a id="downloadBtn" class="download-btn" href="#" target="_blank" download="portada.jpg">
          <i class="fa-solid fa-download"></i> Descargar Imagen
        </a>
      </div>
    </div>
  </div>

  <footer><p>© 2026 TOMK.RAR</p></footer>
  <script src="data.js"></script>
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="public-feed.js"></script>
</body>
</html>
